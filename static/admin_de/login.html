<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmeldung - SysTrack</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js CDN -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/admin/css/custom.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/admin/images/logo.png">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900 transition-colors duration-200" x-data="loginPage()">
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white dark:bg-gray-800 rounded-lg p-6 flex items-center space-x-3">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary-600"></div>
            <span class="text-gray-700 dark:text-gray-300">Anmeldung läuft...</span>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-root" class="fixed top-4 right-4 z-40 space-y-2"></div>

    <!-- Main Layout -->
    <div class="min-h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <!-- Header -->
            <div class="text-center">
                <div class="flex justify-center">
                    <img src="/static/admin/images/logo.png" 
                         alt="BEYZ SYSTEM Logo" 
                         class="h-20 w-20 object-contain bg-white dark:bg-gray-100 rounded-lg p-2">
                </div>
                <h2 class="mt-6 text-3xl font-bold text-gray-900 dark:text-gray-100">
                    Bei SysTrack anmelden
                </h2>
                <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
                    Melden Sie sich an, um auf das Netzwerküberwachungssystem zuzugreifen.
                </p>
            </div>

            <!-- Login Form -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-8">
                <form @submit.prevent="login()" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            E-Mail / Benutzername
                        </label>
                        <input id="email" 
                               name="email" 
                               type="text" 
                               required 
                               x-model="form.email"
                               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                               placeholder="E-Mail oder Benutzername"
                               autocomplete="username">
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Passwort
                        </label>
                        <input id="password" 
                               name="password" 
                               type="password" 
                               required 
                               x-model="form.password"
                               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-100 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                               placeholder="Geben Sie Ihr Passwort ein">
                    </div>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input id="remember-me" 
                                   name="remember-me" 
                                   type="checkbox" 
                                   x-model="form.remember"
                                   class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 dark:border-gray-600 rounded">
                            <label for="remember-me" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">
                                Angemeldet bleiben
                            </label>
                        </div>
                    </div>

                    <div>
                        <button type="submit" 
                                :disabled="isLoading"
                                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                            <span x-show="!isLoading">Anmelden</span>
                            <span x-show="isLoading" class="flex items-center">
                                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                                Anmeldung läuft...
                            </span>
                        </button>
                    </div>
                </form>

                <!-- Error Message -->
                <div x-show="errorMessage" 
                     x-transition:enter="transition ease-out duration-100"
                     x-transition:enter-start="transform opacity-0 scale-95"
                     x-transition:enter-end="transform opacity-100 scale-100"
                     class="mt-4 p-3 bg-red-100 dark:bg-red-900/20 border border-red-300 dark:border-red-700 rounded-lg">
                    <p class="text-sm text-red-700 dark:text-red-400" x-text="errorMessage"></p>
                </div>
            </div>

            <!-- Footer -->
            <div class="text-center">
                <p class="text-xs text-gray-500 dark:text-gray-400">&copy; <span id="current-year"></span> Z System. Alle Rechte vorbehalten.</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/admin/js/helpers.js"></script>
    <script src="/static/admin/js/toast.js"></script>
    <script src="/static/admin/js/login.js"></script>
    <script>
        const yearEl = document.getElementById("current-year");
        if (yearEl) {
            yearEl.textContent = new Date().getFullYear();
        }
    </script>
</body>
</html>
