<style>
  :root{
    --g1: rgba(37,99,235,.23);
    --g2: rgba(34,211,238,.12);
    --g3: rgba(99,102,241,.14);
  }

  /* Reduced motion support */
  @media (prefers-reduced-motion: reduce){
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    .blob, .film, .scanline, .sparkle, .logo-frame::before { display:none !important; }
  }

  .grid-mask {
    background-image:
      radial-gradient(circle at 1px 1px, rgba(148,163,184,.12) 1px, transparent 0),
      radial-gradient(circle at 1px 1px, rgba(37,99,235,.10) 1px, transparent 0);
    background-size: 26px 26px, 52px 52px;
    background-position: 0 0, 13px 13px;
    mask-image: radial-gradient(ellipse at center, black 45%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 45%, transparent 78%);
  }

  .film{
    background:
      radial-gradient(1200px 650px at 12% 12%, var(--g1), transparent 58%),
      radial-gradient(900px 520px at 88% 28%, var(--g2), transparent 62%),
      radial-gradient(1050px 720px at 40% 92%, var(--g3), transparent 62%);
    opacity: .80;
    animation: drift 16s ease-in-out infinite;
    transform: translateZ(0);
  }
  @keyframes drift{
    0%,100%{ transform: translate3d(0,0,0); }
    50%{ transform: translate3d(-14px,10px,0); }
  }

  .blob{
    filter: blur(40px);
    opacity: .55;
    transform: translateZ(0);
    animation: floaty 12s ease-in-out infinite;
  }
  .b2{ animation-duration: 14s; }
  .b3{ animation-duration: 16s; }
  @keyframes floaty{
    0%,100%{ transform: translate3d(0,0,0) scale(1); }
    50%{ transform: translate3d(12px,-16px,0) scale(1.06); }
  }

  .scanline{
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,.05), transparent);
    height: 260px;
    width: 120%;
    transform: rotate(8deg);
    animation: scan 8s linear infinite;
    opacity: .20;
  }
  @keyframes scan{
    0%{ transform: translateY(-280px) rotate(8deg); }
    100%{ transform: translateY(100vh) rotate(8deg); }
  }

  /* --- Premium card glow with two layers --- */
  .card-glow{
    position: relative;
    isolation: isolate;
    --gx: 50%;
    --gy: 18%;
    --hx: 16%;
    --hy: 118%;
  }
  .card-glow::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius: 26px;
    background:
      radial-gradient(900px circle at var(--gx) var(--gy), rgba(59,130,246,.22), transparent 48%),
      radial-gradient(950px circle at var(--hx) var(--hy), rgba(34,211,238,.10), transparent 60%);
    z-index:-1;
    opacity:.95;
  }
  .card-glow::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius: 26px;
    background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 32%, rgba(255,255,255,.03));
    pointer-events:none;
    z-index:0;
    opacity:.35;
  }

  .sparkle{
    background:
      radial-gradient(circle at 20% 35%, rgba(255,255,255,.07) 1px, transparent 2px),
      radial-gradient(circle at 68% 22%, rgba(255,255,255,.06) 1px, transparent 2px),
      radial-gradient(circle at 82% 55%, rgba(255,255,255,.05) 1px, transparent 2px);
    opacity:.55;
    animation: twinkle 6s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.45; transform: translateY(0); }
    50%{ opacity:.75; transform: translateY(-2px); }
  }

  .field{ transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease; }
  .field:focus{ box-shadow: 0 0 0 4px rgba(37,99,235,.14); }

  .btn-shine::before{
    content:"";
    position:absolute;
    inset:-2px;
    background: radial-gradient(900px circle at var(--x,50%) var(--y,50%), rgba(255,255,255,.16), transparent 46%);
    opacity:0;
    transition: opacity .18s ease;
  }
  .btn-shine:hover::before{ opacity:1; }
  .btn-shine::after{
    content:"";
    position:absolute;
    top:-120%;
    left:-30%;
    width: 58%;
    height: 260%;
    transform: rotate(20deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
    opacity: 0;
  }
  .btn-shine:hover::after{
    opacity:.6;
    animation: sweep .95s ease;
  }
  @keyframes sweep{
    from{ transform: translateX(0) rotate(20deg); }
    to{ transform: translateX(265%) rotate(20deg); }
  }

  .ripple {
    position:absolute;
    border-radius:999px;
    transform: translate(-50%,-50%) scale(0);
    background: rgba(255,255,255,.20);
    animation: ripple .55s ease-out;
    pointer-events:none;
    mix-blend-mode: screen;
  }
  @keyframes ripple{
    to{ transform: translate(-50%,-50%) scale(1); opacity:0; }
  }

  .shake{ animation: shake .28s ease-in-out 0s 1; }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-6px); }
    50%{ transform: translateX(6px); }
    75%{ transform: translateX(-3px); }
  }

    .logo-frame{
    width: 100%;
    max-width: 440px;
    border-radius: 22px;

    background: linear-gradient(
        135deg,
        rgba(59,130,246,.70),
        rgba(34,211,238,.28),
        rgba(99,102,241,.38),
        rgba(59,130,246,.55)
    );

    padding: 1px;
    box-shadow:
        0 0 0 1px rgba(255,255,255,.06),

    .logo-inner{

    padding: 8px 20px;

    }

    .systrack-logo{

</style>

  <!-- Premium glow morph + micro UX (no impact on login()) -->
  <script>
    (function () {
      const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const card = document.getElementById("login-card");
      const btn = document.getElementById("login-btn");
      const form = document.getElementById("login-form");
      const errorBox = document.getElementById("error-box");

      const email = document.getElementById("email");
      const pwd = document.getElementById("password");

      // --- Glow morph: starts from default glow anchors and "flows" to cursor ---
      if (card) {
        const baseA = { x: 50, y: 18 };
        const baseB = { x: 16, y: 118 };

        let curA = { ...baseA };
        let curB = { ...baseB };

        let tgtA = { ...baseA };
        let tgtB = { ...baseB };

        let hovering = false;
        let rafId = null;

        const setVars = () => {
          card.style.setProperty("--gx", curA.x.toFixed(2) + "%");
          card.style.setProperty("--gy", curA.y.toFixed(2) + "%");
          card.style.setProperty("--hx", curB.x.toFixed(2) + "%");
          card.style.setProperty("--hy", curB.y.toFixed(2) + "%");
        };

        const lerp = (a, b, t) => a + (b - a) * t;

        const tick = () => {
          const aT = hovering ? 0.14 : 0.10;
          const bT = hovering ? 0.08 : 0.07;

          curA.x = lerp(curA.x, tgtA.x, aT);
          curA.y = lerp(curA.y, tgtA.y, aT);

          curB.x = lerp(curB.x, tgtB.x, bT);
          curB.y = lerp(curB.y, tgtB.y, bT);

          setVars();

          const close = (p, q) => Math.abs(p - q) < 0.08;
          const done =
            !hovering &&
            close(curA.x, tgtA.x) && close(curA.y, tgtA.y) &&
            close(curB.x, tgtB.x) && close(curB.y, tgtB.y);

          if (!done) rafId = requestAnimationFrame(tick);
          else rafId = null;
        };

        const ensureRAF = () => {
          if (reduceMotion) return;
          if (rafId == null) rafId = requestAnimationFrame(tick);
        };

        const toCardPercent = (e) => {
          const r = card.getBoundingClientRect();
          const x = ((e.clientX - r.left) / r.width) * 100;
          const y = ((e.clientY - r.top) / r.height) * 100;
          return { x: Math.max(0, Math.min(100, x)), y: Math.max(0, Math.min(100, y)) };
        };

        card.addEventListener("mouseenter", (e) => {
          hovering = true;
          const p = toCardPercent(e);
          tgtA = { x: p.x, y: p.y };
          tgtB = { x: p.x * 0.85 + 8, y: p.y * 1.05 + 10 };
          ensureRAF();
        });

        card.addEventListener("mousemove", (e) => {
          if (!hovering) return;
          const p = toCardPercent(e);
          tgtA = { x: p.x, y: p.y };
          tgtB = { x: p.x * 0.88 + 6, y: p.y * 1.08 + 9 };
          ensureRAF();
        });

        card.addEventListener("mouseleave", () => {
          hovering = false;
          tgtA = { ...baseA };
          tgtB = { ...baseB };
          ensureRAF();
        });

        setVars();
      }

      // Button shine follows cursor + ripple
      if (btn) {
        btn.addEventListener("mousemove", (e) => {
          const r = btn.getBoundingClientRect();
          const x = ((e.clientX - r.left) / r.width) * 100;
          const y = ((e.clientY - r.top) / r.height) * 100;
          btn.style.setProperty("--x", x + "%");
          btn.style.setProperty("--y", y + "%");
        });

        btn.addEventListener("click", (e) => {
          if (reduceMotion) return;
          const r = btn.getBoundingClientRect();
          const size = Math.max(r.width, r.height) * 1.2;
          const ripple = document.createElement("span");
          ripple.className = "ripple";
          ripple.style.width = ripple.style.height = size + "px";
          ripple.style.left = (e.clientX - r.left) + "px";
          ripple.style.top = (e.clientY - r.top) + "px";
          btn.appendChild(ripple);
          ripple.addEventListener("animationend", () => ripple.remove());
        });
      }

      // Error shake when content changes
      if (errorBox && !reduceMotion) {
        const obs = new MutationObserver(() => {
          const visible = window.getComputedStyle(errorBox).display !== "none";
          if (!visible) return;
          errorBox.classList.remove("shake");
          void errorBox.offsetWidth;
          errorBox.classList.add("shake");
        });
        obs.observe(errorBox, { childList: true, subtree: true, characterData: true });
      }

      // Password show/hide
      const toggle = document.getElementById("toggle-password");
      const eyeOpen = document.getElementById("eye-open");
      const eyeClosed = document.getElementById("eye-closed");

      if (pwd && toggle && eyeOpen && eyeClosed) {
        const setState = (show) => {
          pwd.type = show ? "text" : "password";
          eyeOpen.classList.toggle("hidden", show);
          eyeClosed.classList.toggle("hidden", !show);
          toggle.setAttribute("aria-pressed", show ? "true" : "false");
        };
        setState(false);

        toggle.addEventListener("click", () => {
          setState(pwd.type === "password");
          pwd.focus({ preventScroll: true });
        });

        toggle.addEventListener("mousedown", () => { if (!reduceMotion) setState(true); });
        toggle.addEventListener("mouseup", () => setState(false));
        toggle.addEventListener("mouseleave", () => setState(false));
        toggle.addEventListener("touchstart", () => { setState(true); }, { passive: true });
        toggle.addEventListener("touchend", () => setState(false));
      }

      // CapsLock hint
      const capsHint = document.getElementById("caps-hint");
      if (pwd && capsHint) {
        const checkCaps = (e) => {
          const on = e.getModifierState && e.getModifierState("CapsLock");
          capsHint.classList.toggle("hidden", !on);
          capsHint.classList.toggle("flex", !!on);
        };
        pwd.addEventListener("keyup", checkCaps);
        pwd.addEventListener("keydown", checkCaps);
        pwd.addEventListener("blur", () => {
          capsHint.classList.add("hidden");
          capsHint.classList.remove("flex");
        });
      }

      // Enter flow: email -> password
      if (email && pwd) {
        email.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            pwd.focus();
          }
        });
      }

      // Disable all fields while loading overlay visible
      if (form) {
        const setDisabled = (disabled) => {
          form.querySelectorAll("input, button").forEach((el) => {
            if (el.id === "login-btn") return;
            el.disabled = disabled;
          });
        };
        const overlay = document.getElementById("loading-overlay");
        if (overlay) {
          const obs = new MutationObserver(() => {
            const isVisible = !overlay.classList.contains("hidden");
            setDisabled(isVisible);
          });
          obs.observe(overlay, { attributes: true, attributeFilter: ["class"] });
        }
      }

      const yearEl = document.getElementById("current-year");
      if (yearEl) {
        yearEl.textContent = new Date().getFullYear();
      }
    })();
  </script>
</body>
</html>
